<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80" aria-label="महाराष्ट्रीय कलोपासक लोगो">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E08B" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B1C2A" />
      <stop offset="100%" stop-color="#4A0D12" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Icon: Stylized Theatre Mask + Diya / Flame -->
  <g transform="translate(6, 4)">
    <!-- Outer Shield / Circle -->
    <circle cx="36" cy="36" r="34" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="36" cy="36" r="30" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3,2" opacity="0.6" />
    
    <!-- Stylized Natya Mask & Nataraj Flame Motif -->
    <!-- Diya Base -->
    <path d="M 22 45 Q 36 54 50 45 Q 36 50 22 45 Z" fill="url(#goldGrad)" />
    <!-- Flame / Crown -->
    <path d="M 36 14 Q 44 26 36 36 Q 28 26 36 14 Z" fill="url(#goldGrad)" />
    <path d="M 36 20 Q 40 28 36 34 Q 32 28 36 20 Z" fill="#FFE5A3" />
    
    <!-- Classical Theatre Mask Features -->
    <path d="M 24 30 Q 30 26 34 31 Q 28 32 24 30 Z" fill="url(#goldGrad)" />
    <path d="M 48 30 Q 42 26 38 31 Q 44 32 48 30 Z" fill="url(#goldGrad)" />
    <!-- Smile / Expression Curve -->
    <path d="M 28 40 Q 36 46 44 40 Q 36 43 28 40 Z" fill="url(#goldGrad)" />
    
    <!-- Year in small Devanagari arc -->
    <text x="36" y="62" font-family="'Mukta', 'Noto Sans Devanagari', sans-serif" font-size="8" font-weight="700" fill="#F5E08B" text-anchor="middle" letter-spacing="1">स्था. १९६३</text>
  </g>

  <!-- Brand Typography -->
  <!-- Main Title Marathi -->
  <text x="88" y="37" font-family="'Tiro Devanagari Marathi', 'Noto Serif Devanagari', 'Georgia', serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
    महाराष्ट्रीय <tspan fill="url(#goldGrad)">कलोपासक</tspan>
  </text>
  
  <!-- Subtitle English + Marathi -->
  <text x="90" y="56" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#E5C058" letter-spacing="2">
    MAHARASHTRIYA KALOPASAK
  </text>
  <text x="90" y="69" font-family="'Mukta', 'Noto Sans Devanagari', sans-serif" font-size="10" font-weight="400" fill="#D6C5B3" letter-spacing="0.8">
    पुणे • ६० वर्षांची नाट्य परंपरा (१९६३)
  </text>
</svg>
