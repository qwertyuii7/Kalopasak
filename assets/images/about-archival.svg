<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sepiaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A1E14"/>
      <stop offset="50%" stop-color="#6B3A22"/>
      <stop offset="100%" stop-color="#24120A"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE899"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6510"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#140803" stop-opacity="0.75" />
    </radialGradient>
    <filter id="vintagePaper">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.95   0 0 0 0 0.88   0 0 0 0 0.75  0 0 0 0.15 0" />
      <feBlend in="SourceGraphic" in2="noise" mode="multiply" />
    </filter>
  </defs>

  <!-- Offset Shadow Base -->
  <rect x="35" y="35" width="730" height="530" rx="16" fill="#1C090C" opacity="0.6" />
  
  <!-- Outer Archival Mat / Frame -->
  <rect x="20" y="20" width="740" height="540" rx="14" fill="#2E1116" stroke="url(#goldBorder)" stroke-width="4" />
  <rect x="32" y="32" width="716" height="516" rx="10" fill="none" stroke="url(#goldBorder)" stroke-width="1.5" stroke-dasharray="6,3" />

  <!-- Inside Sepia Photograph Canvas -->
  <g transform="translate(48, 48)">
    <rect width="684" height="484" rx="8" fill="url(#sepiaGrad)" />
    
    <!-- Archival Graphics: Classical Pune Theatre Hall / Bharat Natya Mandir Architecture -->
    <!-- Proscenium Arch Graphic -->
    <path d="M 40 484 L 40 120 Q 342 20 644 120 L 644 484" fill="none" stroke="#DDB86C" stroke-width="4" opacity="0.45" />
    <path d="M 60 484 L 60 135 Q 342 45 624 135 L 624 484" fill="none" stroke="#DDB86C" stroke-width="1.5" opacity="0.3" />

    <!-- Vintage Playbill / Natak Poster typography elements -->
    <text x="342" y="100" font-family="'Tiro Devanagari Marathi', 'Noto Serif Devanagari', serif" font-size="22" font-weight="700" fill="#FFE899" text-anchor="middle" letter-spacing="2">
      महाराष्ट्रीय कलोपासक
    </text>
    <text x="342" y="130" font-family="'Mukta', sans-serif" font-size="14" fill="#E2C99F" text-anchor="middle" letter-spacing="4">
      स्थापना : १९६३ • पुणे
    </text>

    <!-- Stage silhouettes representing the founders and pioneering actors -->
    <g fill="#1F0E07" opacity="0.9">
      <!-- Founder & Stage Director in vintage Nehru coat silhouette -->
      <circle cx="260" cy="310" r="22" fill="#2D150B"/>
      <path d="M 235 338 L 285 338 L 295 460 L 225 460 Z" />
      <path d="M 240 350 L 195 385 L 205 395 L 245 365 Z" />
      <!-- Script in hand -->
      <rect x="180" y="375" width="22" height="30" rx="2" fill="#EAD5A8" transform="rotate(-20 180 375)" />

      <!-- Passionate Actor delivering monologue -->
      <circle cx="430" cy="290" r="24" fill="#2D150B"/>
      <path d="M 405 320 L 455 320 L 470 460 L 390 460 Z" />
      <path d="M 445 325 L 495 285 L 505 295 L 455 340 Z" />
    </g>

    <!-- Vintage Commemorative Stamp / Seal in Corner -->
    <g transform="translate(560, 370)">
      <circle cx="50" cy="50" r="44" fill="#541219" stroke="url(#goldBorder)" stroke-width="2.5" />
      <circle cx="50" cy="50" r="38" fill="none" stroke="url(#goldBorder)" stroke-width="1" stroke-dasharray="3,2" />
      <text x="50" y="38" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#FFEBB0" text-anchor="middle" letter-spacing="1">PUNE THEATRE</text>
      <text x="50" y="55" font-family="'Mukta', sans-serif" font-size="15" font-weight="bold" fill="#FCE182" text-anchor="middle">६०+ वर्षे</text>
      <text x="50" y="70" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#FFEBB0" text-anchor="middle">SINCE 1963</text>
    </g>

    <!-- Vignette overlay -->
    <rect width="684" height="484" fill="url(#vignette)" />
  </g>
</svg>
