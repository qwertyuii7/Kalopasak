<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="victoryGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFEBB0" stop-opacity="1" />
      <stop offset="25%" stop-color="#E2B144" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#871724" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#120406" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="trophyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5CC" />
      <stop offset="30%" stop-color="#F3CA52" />
      <stop offset="70%" stop-color="#C28B15" />
      <stop offset="100%" stop-color="#6E4400" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#120406" />
  <rect width="1600" height="900" fill="url(#victoryGlow)" />

  <!-- Confetti and Sparkles -->
  <g opacity="0.6">
    <rect x="300" y="150" width="8" height="18" fill="#FCE182" transform="rotate(25 300 150)"/>
    <rect x="520" y="90" width="10" height="22" fill="#E84855" transform="rotate(-15 520 90)"/>
    <rect x="750" y="60" width="8" height="18" fill="#FFF5CC" transform="rotate(40 750 60)"/>
    <rect x="940" y="110" width="10" height="20" fill="#FCE182" transform="rotate(-30 940 110)"/>
    <rect x="1200" y="180" width="8" height="24" fill="#E84855" transform="rotate(18 1200 180)"/>
    <circle cx="450" cy="220" r="4" fill="#FFEBB0"/>
    <circle cx="820" cy="200" r="5" fill="#FFEBB0"/>
    <circle cx="1100" cy="260" r="4" fill="#FFEBB0"/>
  </g>

  <!-- Stage Planks -->
  <polygon points="0,670 1600,670 1600,900 0,900" fill="#1C0C0F" />

  <!-- The Great Trophy (Karandak Cup) Centerpiece Raised High -->
  <g transform="translate(800, 360)">
    <!-- Aura -->
    <circle cx="0" cy="0" r="160" fill="#FFE9A3" opacity="0.25" filter="blur(20px)" />
    
    <!-- Cup Body -->
    <path d="M -60 -70 L 60 -70 L 45 40 Q 0 80 -45 40 Z" fill="url(#trophyGold)" stroke="#FFF" stroke-width="1.5"/>
    <!-- Handles -->
    <path d="M -60 -50 C -110 -50, -100 20, -45 25" fill="none" stroke="url(#trophyGold)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 60 -50 C 110 -50, 100 20, 45 25" fill="none" stroke="url(#trophyGold)" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Stem & Base -->
    <path d="M -16 65 L 16 65 L 20 120 L -20 120 Z" fill="url(#trophyGold)"/>
    <path d="M -50 120 L 50 120 L 65 155 L -65 155 Z" fill="#2E161C" stroke="url(#trophyGold)" stroke-width="3"/>
    
    <!-- Plaque on Base -->
    <rect x="-40" y="128" width="80" height="20" rx="3" fill="url(#trophyGold)"/>
    <text x="0" y="142" font-family="'Mukta', sans-serif" font-size="10" font-weight="700" fill="#420B10" text-anchor="middle">पुरुषोत्तम करंडक</text>
  </g>

  <!-- Celebrating Team Silhouettes raising the trophy -->
  <g fill="#17070A">
    <!-- Left Winner Holding Trophy -->
    <circle cx="710" cy="490" r="28"/>
    <path d="M 690 520 L 730 520 L 760 675 L 670 675 Z"/>
    <!-- Arms reaching up to trophy -->
    <path d="M 700 525 L 750 430 L 765 440 L 725 535 Z" fill="#250E14"/>

    <!-- Right Winner Holding Trophy -->
    <circle cx="890" cy="490" r="28"/>
    <path d="M 870 520 L 910 520 L 930 675 L 840 675 Z"/>
    <!-- Arms reaching up to trophy -->
    <path d="M 900 525 L 850 430 L 835 440 L 875 535 Z" fill="#250E14"/>

    <!-- Cheering Teammates on sides with arms in air -->
    <circle cx="560" cy="520" r="24"/>
    <path d="M 545 545 L 580 545 L 600 680 L 530 680 Z"/>
    <path d="M 545 545 L 505 450 L 525 445 L 565 545 Z" fill="#250E14"/>

    <circle cx="1040" cy="520" r="24"/>
    <path d="M 1025 545 L 1060 545 L 1070 680 L 1000 680 Z"/>
    <path d="M 1055 545 L 1095 450 L 1075 445 L 1035 545 Z" fill="#250E14"/>
  </g>
</svg>
